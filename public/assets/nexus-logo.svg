<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070414"/>
      <stop offset="100%" stop-color="#150a2e"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9333ea"/>
      <stop offset="50%" stop-color="#c026d3"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="120" fill="url(#bgGrad)"/>
  <rect x="16" y="16" width="480" height="480" rx="104" fill="none" stroke="url(#borderGrad)" stroke-width="4" stroke-opacity="0.4"/>
  <g transform="translate(256, 256)">
    <!-- Outer rotated diamond -->
    <rect x="-110" y="-110" width="220" height="220" rx="42" fill="none" stroke="url(#accentGrad)" stroke-width="20" transform="rotate(45)"/>
    <!-- Inner diamond accent -->
    <rect x="-60" y="-60" width="120" height="120" rx="24" fill="none" stroke="#e9d5ff" stroke-width="12" stroke-opacity="0.9" transform="rotate(45)"/>
    <!-- Core glowing node -->
    <circle cx="0" cy="0" r="26" fill="url(#accentGrad)"/>
    <circle cx="0" cy="0" r="10" fill="#ffffff"/>
  </g>
</svg>
